name: CI

on:
  push:
    branches: ["main", "master", "develop", "feature/**"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, types, builds, and dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.4

      - name: Install root dependencies
        run: npm ci

      - name: Install MCP server dependencies
        run: npm ci
        working-directory: mcp-server

      - name: Install UI dependencies
        run: bun install --cwd ui --frozen-lockfile

      - name: Run owned test suites
        run: npm test

      - name: Build Shannon
        run: npm run build

      - name: Build MCP server
        run: npm run build:mcp

      - name: Build UI
        run: npm run build:ui

      - name: Audit root dependencies
        run: npm run audit:dependencies

      - name: Audit MCP server dependencies
        run: npm audit --audit-level=high --omit=optional
        working-directory: mcp-server

      - name: Audit UI dependencies
        run: bun audit --cwd ui --audit-level=high

  security-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-dirs: node_modules,dist,ui/dist,mcp-server/dist,audit-logs,xben-benchmark-results,.playwright-cli
